apiVersion: v1
kind: Service
metadata:
  name: saleor-dash-lb
  namespace: saleor1
  annotations:
    #specify the controller that will handle this lb
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

spec:
  type: LoadBalancer
  selector:
    app: dash
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    

