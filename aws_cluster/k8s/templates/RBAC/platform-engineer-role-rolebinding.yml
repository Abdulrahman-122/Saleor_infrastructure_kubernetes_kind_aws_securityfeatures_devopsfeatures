apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-engineer
  namespace: saleor1
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-engineers
  namespace: saleor1
subjects:
  - kind: Group
    name: platform-engineers
    apiGroup: rbac.authorization.k8s.io
roleRef:
    kind: Role
    name: platform-engineer
    apiGroup: rbac.authorization.k8s.io
