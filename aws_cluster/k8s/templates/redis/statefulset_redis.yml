apiVersion: apps/v1
kind: StatefulSet
metadata:
  name:   {{ .Values.redis.name }}
  namespace:  {{ .Values.redis.ns }}
spec:
  serviceName: redis
  replicas:  {{ .Values.redis.replicas }}
  selector:
    matchLabels:
      app:  {{ .Values.redis.app }}
  template:
    metadata:

      labels:
        app:  {{ .Values.redis.app }}
    spec:
     priorityClassName: production-api 
     containers:
       - name: redis
         image:  {{ .Values.redis.image.repo }}:{{ .Values.redis.image.tag }}
         ports:
           - name:  {{ .Values.redis.ports.name }}
             containerPort: {{ .Values.redis.ports.port }}
         startupProbe:
           exec:
             command:
               - redis-cli
               - ping
           periodSeconds: 5
           timeoutSeconds: 3
           failureThreshold: 30
         readinessProbe:
           exec:
             command:
               - redis-cli
               - ping
           periodSeconds: 5
           timeoutSeconds: 3
           failureThreshold: 3
         livenessProbe:
           exec:
             command:
               - redis-cli
               - ping
           periodSeconds: 10
           timeoutSeconds: 3
           failureThreshold: 3

         volumeMounts:
          - name: {{ .Values.redis.volume }}
            mountPath: /data
         resources:
           requests:
            cpu: {{ .Values.redis.resources.req.cpu }}
            memory: {{ .Values.redis.resources.req.mem }}
           limits:
            cpu: {{ .Values.redis.resources.lim.cpu }}
            memory: {{ .Values.redis.resources.lim.mem }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.redis.volume }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
            requests:
              storage: 1Gi




